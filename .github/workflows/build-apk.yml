
name: Build JAOXIT APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto Android
        run: unzip -q JAOXIT_V1_Android.zip

      - name: Construir APK
        working-directory: JAOXIT_V1_Android
        run: gradle assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: JAOXIT-V1-APK
          path: JAOXIT_V1_Android/app/build/outputs/apk/debug/app-debug.apk
